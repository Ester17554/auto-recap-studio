<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Recap Studio V12 — Mapa Guiado</title><style>body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:18px}.card{max-width:900px;margin:auto;background:#1c1c1c;padding:20px;border-radius:16px}h1{font-size:22px}h2{font-size:18px;margin-top:24px}textarea,input{width:100%;box-sizing:border-box;background:#101010;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;margin:7px 0 14px}button{background:#fff;color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;margin:4px;cursor:pointer}.small{color:#aaa;font-size:13px;line-height:1.5}.event{border:1px solid #3b3b3b;border-radius:12px;padding:14px;margin:12px 0;background:#171717}.badge{display:inline-block;border:1px solid #555;border-radius:20px;padding:4px 8px;font-size:12px;margin:3px}.candidate{background:#222;padding:10px;border-radius:9px;margin:7px 0;font-size:13px}</style></head><body><div class="card"><h1>Auto Recap Studio V12 — Mapa Guiado</h1><p class="small">Camada de revisão sobre o CSV exportado pelo V11. O V12 não afirma que uma cena corresponde semanticamente à narração; ele mostra o que a cena precisa representar e os candidatos do V11 para conferência.</p><h2>1. Importe o CSV do V11</h2><input id="csv" type="file" accept=".csv,text/csv"><h2>2. Cole o roteiro</h2><textarea id="script" rows="10" placeholder="Cole aqui o roteiro completo usado na narração..."></textarea><button onclick="build()">Criar mapa guiado</button><button onclick="downloadMap()">Baixar MAPA_V12_GUIADO.txt</button><div id="status" class="small"></div><div id="out"></div></div><script>let rows=[],map=[];const cues=[['ABERTURA','Bear quer conquistar Nikki','Bear e Nikki precisam aparecer em situação que deixe claro o interesse entre os dois.'],['CONTEXTO','Bear e Nikki / rotina','Cenas da rotina dos dois, especialmente no ambiente de trabalho/música.'],['DECLARAÇÃO','Bear não consegue se declarar','Bear e Nikki juntos; linguagem corporal de timidez, hesitação ou tentativa de aproximação.'],['WILLOW','Bear encontra a One Wish Willow','Mostrar o objeto/Willow ou a descoberta que leva Bear à solução sobrenatural.'],['DESEJO','Bear faz o pedido','Bear usando/manipulando a Willow e realizando o desejo.'],['MUDANÇA','O desejo funciona','Nikki demonstrando mudança de comportamento em relação a Bear.'],['PRIMEIRO SINAL','Algo está errado','Nikki em comportamento estranho, intenso ou desconfortável.'],['OBSESSÃO','Nikki fica obcecada','Cenas em que Nikki persegue, procura ou não consegue ficar longe de Bear.'],['CIÚMES','Nikki reage aos outros','Nikki demonstrando ciúme, ameaça ou reação anormal a outras pessoas.'],['AJUDA','Nikki/Bear precisam de ajuda','Bear ou Nikki em situação de pedido de ajuda, conflito ou tentativa de escapar.'],['IAN','Ian entra na situação','Ian aparecendo ou participando da investigação/teste da Willow.'],['VIOLÊNCIA','A situação fica perigosa','Agressão, perseguição, ameaça ou violência relacionada à obsessão.'],['MORTES','Sarah e Ian','Cenas correspondentes às mortes/ataques, quando existirem no filme.'],['VERDADE','Bear entende o que criou','Bear descobrindo que a Nikki alterada não possui autonomia normal.'],['ÚLTIMA ESPERANÇA','Bear tenta desfazer tudo','Bear preparando/realizando a última tentativa de resolver o problema.'],['CLÍMAX','Confronto final','Bear e Nikki no confronto principal, com a maior intensidade visual.'],['ARMA','Tentativa com arma','Mostrar a arma/objeto e a ação correspondente, se presente.'],['COMPRIMIDOS','Tentativa com comprimidos','Mostrar comprimidos/remédio e a ação correspondente, se presente.'],['WILLOW QUEBRADO','A Willow é destruída','Objeto Willow quebrado/destruído ou consequência visual direta.'],['ÚLTIMO DESEJO','Nikki faz novo desejo','Nikki realizando o desejo final ou usando a Willow pela última vez.'],['NIKKI LIVRE','Nikki volta a si','Nikki demonstrando mudança/normalidade após a resolução.'],['FINAL','Última consequência','Cenas finais que sustentem exatamente a última fala da narração.']];function parseCSV(text){const lines=text.trim().split(/\r?\n/);if(!lines.length)return[];const sep=lines[0].includes(';')?';':',';const head=lines[0].split(sep).map(x=>x.trim().replace(/^"|"$/g,''));return lines.slice(1).map(line=>{const vals=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));let o={};head.forEach((h,i)=>o[h]=vals[i]??'');return o})}document.getElementById('csv').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;rows=parseCSV(await f.text());document.getElementById('status').textContent=`CSV carregado: ${rows.length} candidatos.`});function build(){const s=document.getElementById('script').value.trim();if(!rows.length){alert('Importe primeiro o CSV do V11.');return}if(!s){alert('Cole o roteiro.');return}map=cues.map((c,i)=>{const start=Math.floor(i*rows.length/cues.length);const end=Math.min(rows.length,Math.floor((i+1)*rows.length/cues.length));return{code:c[0],title:c[1],need:c[2],candidates:rows.slice(start,end).slice(0,4)}});render()}function render(){let h='<h2>Mapa guiado</h2><p class="small">Regra: se o candidato não mostra o que está descrito em “O que a cena precisa mostrar”, descarte-o mesmo que o score do V11 seja alto.</p>';map.forEach((m,i)=>{h+=`<div class="event"><div><span class="badge">${i+1}</span><b>${m.code}</b></div><h3>${m.title}</h3><p>${m.need}</p>`;if(!m.candidates.length)h+='<div class="small">Sem candidatos disponíveis nesta faixa do CSV.</div>';m.candidates.forEach((r,j)=>{h+=`<div class="candidate"><b>Candidato ${j+1}</b> — ${r.cena_id||'?'}<br>Narração: ${r.narracao_inicio||'?'} → ${r.narracao_fim||'?'}<br>Filme: ${r.filme_inicio||'?'} → ${r.filme_fim||'?'} | Frame: ${r.frame||'?'} | Score: ${r.score||'?'}</div>`});h+='</div>'});document.getElementById('out').innerHTML=h}function downloadMap(){if(!map.length){alert('Crie o mapa primeiro.');return}let t='AUTO RECAP STUDIO V12 — MAPA GUIADO\n\nIMPORTANTE: este mapa é uma camada de revisão sobre os candidatos do V11. O score não comprova que a cena representa a narração.\n\n';map.forEach((m,i)=>{t+=`${i+1}. ${m.code} — ${m.title}\nO QUE A CENA PRECISA MOSTRAR: ${m.need}\n`;m.candidates.forEach((r,j)=>{t+=`  Candidato ${j+1}: ${r.cena_id||''} | Narração ${r.narracao_inicio||''}-${r.narracao_fim||''} | Filme ${r.filme_inicio||''}-${r.filme_fim||''} | Frame ${r.frame||''} | Score ${r.score||''}\n`});t+='\n'});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='MAPA_V12_GUIADO.txt';a.click()}</script></body></html>
